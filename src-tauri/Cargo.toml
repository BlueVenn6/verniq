[package]
name = "my-life-map-desktop"
version = "0.1.0"
description = "Verniq desktop app"
authors = ["Nera Venn"]
license = "Apache-2.0"
repository = "https://github.com/BlueVenn6/verniq"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
