name: Verify source and production web
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # generate_context! embeds frontendDist, even for the native test binary.
      - run: npm run build
      # No installer or unsigned release is published by this verification job.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-verification
          path: |
            build/*results.json
            build/*.png
            out/verniq-build.json
